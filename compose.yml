services:
  db:
    image: postgres:18
    container_name: pakinggan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pakinggan
      POSTGRES_PASSWORD: development
      POSTGRES_DB: pakinggan
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
