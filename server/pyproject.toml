[project]
name = "pakinggan"
version = "0.1.0"
description = "A music tracking and discovery app."
readme = "README.md"
authors = [
    { email = "gavin.eugenio@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.162.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "app"
