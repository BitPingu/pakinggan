# Name displayed in the GitHub Actions tab.
name: CI

# Run the workflow whenever code is pushed or a pull request is opened.
on:
  push:
  pull_request:

# Grant the workflow read-only access to repository contents.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    # Start a temporary PostgreSQL service for backend tests.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pakinggan
          POSTGRES_PASSWORD: development
          POSTGRES_DB: pakinggan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pakinggan -d pakinggan"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Provide database connection strings to backend commands.
    env:
      JWT_SECRET_KEY: 'ci-test-secret-key-do-not-use-in-production'
      DATABASE_URL: postgresql+psycopg://pakinggan:development@localhost:5432/pakinggan
      TEST_DATABASE_URL: postgresql+psycopg://pakinggan:development@localhost:5432/pakinggan_test
      LASTFM_API_KEY: test_api_key
      LASTFM_SHARED_SECRET: test_shared_secret
      LASTFM_ENCRYPTION_KEY: ${{ secrets.CI_LASTFM_ENCRYPTION_KEY }}

    steps:
      # Download the repository contents.
      - name: Check out repository
        uses: actions/checkout@v4

      # Set up Node.js for frontend tooling.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      # Set up Python for the backend.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install uv for Python dependency management.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Install root dependencies, including Prettier.
      - name: Install root dependencies
        run: npm ci

      # Install frontend dependencies.
      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      # Install backend dependencies using the committed lockfile.
      - name: Install backend dependencies
        working-directory: server
        run: uv sync --locked --dev

      # Create a separate database for automated tests.
      - name: Create test database
        run: |
          PGPASSWORD=development createdb \
            -h localhost \
            -U pakinggan \
            pakinggan_test

      # Run formatting, linting, build, and backend tests.
      - name: Run checks
        run: npm run check
